services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: assistkb-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assistkb-api
    env_file:
      - .env
    environment:
      VECTOR_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: assistkb_chunks
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      EMBED_BATCH_SIZE: "64"
      RETRIEVAL_THRESHOLD: "0.35"
      GROQ_MODEL: llama-3.3-70b-versatile
    depends_on:
      - qdrant
    ports:
      - "8000:8000"
    volumes:
      - ./corpus:/app/corpus
      - hf_cache:/root/.cache/huggingface

volumes:
  qdrant_storage:
  hf_cache:
