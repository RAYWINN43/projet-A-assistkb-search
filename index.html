<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssistKB - Interface de Recherche</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #99c 0%, #334 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px #000A;
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .health-status {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
        }

        .health-status.ok {
            color: #060;
        }

        .health-status.error {
            color: #600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus {
            outline: none;
            border-color: #66e;
            box-shadow: 0 0 0 3px #0061;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .slider-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="range"] {
            flex: 1;
        }

        .slider-value {
            min-width: 30px;
            text-align: center;
            color: #66e;
            font-weight: 600;
        }

        button {
            background: #66e;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            width: 100%;
        }

        button:hover {
            background: #66c;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #66e;
        }

        .spinner {
            border: 3px solid #eee;
            border-top: 3px solid #66e;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result {
            display: none;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        .answer-section {
            margin-bottom: 20px;
        }

        .answer-section h2 {
            color: #333;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .answer-text {
            background: #eee;
            padding: 15px;
            border-radius: 5px;
            line-height: 1.6;
            color: #555;
            border-left: 4px solid #66e;
        }

        .sources-section {
            margin-bottom: 20px;
        }

        .sources-list {
            display: grid;
            gap: 10px;
        }

        .source-item {
            background: #eee;
            padding: 12px;
            border-radius: 5px;
            font-size: 13px;
            color: #555;
        }

        .source-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .source-file {
            color: #999;
            font-size: 12px;
        }

        .metadata {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .metadata-item {
            text-align: center;
        }

        .metadata-label {
            display: block;
            color: #999;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .metadata-value {
            display: block;
            color: #333;
            font-weight: 600;
            font-size: 16px;
        }

        .error {
            background: #fdd;
            border: 1px solid #fdd;
            color: #600;
            padding: 12px;
            border-radius: 5px;
            margin-top: 20px;
            display: none;
        }

        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>AssistKB-Neosoft</h1>
            <div class="health-status" id="healthStatus">Vérification...</div>
        </header>

        <form id="queryForm">
            <div class="form-group">
                <label for="question">Votre Question</label>
                <textarea id="question" placeholder="Posez votre question..." required></textarea>
            </div>

            <div class="form-group">
                <label for="topK">Nombre de résultats (top-k)</label>
                <div class="slider-group">
                    <input type="range" id="topK" min="1" max="20" value="5">
                    <span class="slider-value" id="topKValue">5</span>
                </div>
            </div>

            <button type="submit">Rechercher</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <span>Recherche en cours...</span>
        </div>

        <div class="error" id="error"></div>

        <div class="result" id="result">
            <div class="answer-section">
                <h2>Réponse</h2>
                <div class="answer-text" id="answerText"></div>
            </div>

            <div class="sources-section">
                <h2>Sources</h2>
                <div class="sources-list" id="sourcesList"></div>
            </div>

            <div class="metadata">
                <div class="metadata-item">
                    <span class="metadata-label">Temps de réponse</span>
                    <span class="metadata-value" id="latency">0 ms</span>
                </div>
                <div class="metadata-item">
                    <span class="metadata-label">Tokens Entrée</span>
                    <span class="metadata-value" id="inputTokens">0</span>
                </div>
                <div class="metadata-item">
                    <span class="metadata-label">Tokens Sortie</span>
                    <span class="metadata-value" id="outputTokens">0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000';
        
        const queryForm = document.getElementById('queryForm');
        const questionInput = document.getElementById('question');
        const topKInput = document.getElementById('topK');
        const topKValue = document.getElementById('topKValue');
        const loadingDiv = document.getElementById('loading');
        const resultDiv = document.getElementById('result');
        const errorDiv = document.getElementById('error');
        const healthStatus = document.getElementById('healthStatus');
        
        // Slider topK
        topKInput.addEventListener('input', (e) => {
            topKValue.textContent = e.target.value;
        });

        // Healthcheck
        checkHealth();

        async function checkHealth() {
            try {
                const response = await fetch(`${API_BASE_URL}/health`);
                if (response.ok) {
                    const data = await response.json();
                    const indexed = data.qdrant.indexed_chunks || 0;
                    healthStatus.textContent = `API en ligne : ${indexed} chunks indexés`;
                    healthStatus.classList.add('ok');
                } else {
                    throw new Error('API non disponible');
                }
            } catch (error) {
                healthStatus.textContent = 'API non disponible';
                healthStatus.classList.add('error');
            }
        }

        // Submit
        queryForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearError();
            resultDiv.style.display = 'none';
            loadingDiv.style.display = 'block';

            const question = questionInput.value.trim();
            const topK = parseInt(topKInput.value);

            try {
                const response = await fetch(`${API_BASE_URL}/ask`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        question: question,
                        top_k: topK
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || `Erreur ${response.status}`);
                }

                const data = await response.json();
                displayResult(data);
            } catch (error) {
                showError(error.message);
            } finally {
                loadingDiv.style.display = 'none';
            }
        });

        // Display
        function displayResult(data) {
            document.getElementById('answerText').textContent = data.answer;

            const sourcesList = document.getElementById('sourcesList');
            sourcesList.innerHTML = '';
            if (data.sources && data.sources.length > 0) {
                data.sources.forEach((source, index) => {
                    const sourceItem = document.createElement('div');
                    sourceItem.className = 'source-item';
                    sourceItem.innerHTML = `
                        <div class="source-title">Source ${index + 1}</div>
                        <div class="source-file">${source.source || 'Fichier non spécifié'}</div>
                        <div>${source.text || 'Contenu non disponible'}</div>
                    `;
                    sourcesList.appendChild(sourceItem);
                });
            } else {
                sourcesList.innerHTML = '<p style="color: #999;">Aucune source trouvée</p>';
            }

            document.getElementById('latency').textContent = `${data.latency_ms} ms`;
            document.getElementById('inputTokens').textContent = data.input_tokens;
            document.getElementById('outputTokens').textContent = data.output_tokens;

            resultDiv.style.display = 'block';
        }

        function showError(message) {
            errorDiv.textContent = `Erreur: ${message}`;
            errorDiv.classList.add('show');
        }

        function clearError() {
            errorDiv.classList.remove('show');
            errorDiv.textContent = '';
        }
    </script>
</body>
</html>
