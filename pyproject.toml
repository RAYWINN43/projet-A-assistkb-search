[project]
name = "projet-a-assistkb-search"
version = "0.1.0"
description = "Projet A AssistKB Search - RAG avec embeddings locaux et Qdrant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "qdrant-client>=1.12.0,<1.13.0",
    "sentence-transformers>=3.0.0",
    "openai>=1.80.0",
    "pdfplumber>=0.11.0",
    "pypdf>=5.0.0",
    "langdetect>=1.0.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = true
